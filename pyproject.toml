[project]
name = "nn-bowl"
version = "0.1.0"
description = "Code for \"Growing a Neural Network in Breadth, Depth, and Time\" (NeurIPS 2026)"
authors = [
    {name = "Eivinas Butkus"},
    {name = "Kedar Garzón Gupta"},
    {name = "Nikolaus Kriegeskorte"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch (>=2.5.1,<3.0.0)",
    "hydra-core (>=1.3.2,<2.0.0)",
    "datasets (>=3.6.0,<4.0.0)",
    "torchvision (>=0.20.1,<0.23.0)",
    "tensorboard (>=2.19.0,<3.0.0)",
    "omegaconf (>=2.3.0,<3.0.0)",
    "standard-imghdr (>=3.13.0,<4.0.0)",
    "notebook (>=7.4.4,<8.0.0)",
    "ipykernel (>=6.29.5,<7.0.0)",
    "tbparse (>=0.0.9,<0.0.10)",
    "matplotlib (>=3.10.3,<4.0.0)",
    "plotly (>=6.2.0,<7.0.0)",
    "adjusttext (>=1.3.0,<2.0.0)",
    "protobuf (>=3.2.0,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "imageio (>=2.37.0,<3.0.0)",
    "ipywidgets (>=8.1.7,<9.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "statsmodels (>=0.14.0,<0.15.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
